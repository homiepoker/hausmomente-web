<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Hausmomente · Unser Weg nach Hause</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233e32;background:#f5f3ec;line-height:1.5;--green:#234c3c;--muted:#69746b;--line:#dddcd1}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;min-height:44px;border:1px solid var(--line);background:#fff;color:var(--green);border-radius:12px;padding:10px 16px;font-weight:650}button:hover{background:#e9eee7}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:#a52b2b}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b37c35;outline-offset:3px}
header{background:var(--green);color:#fff;padding:24px max(20px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-family:Georgia,serif;font-size:25px;letter-spacing:-.7px}header small{display:block;color:#d4dfd1}#status{font-size:12px;border:1px solid #668071;padding:5px 10px;border-radius:30px;white-space:nowrap}
main{max-width:1080px;margin:auto;padding:36px 24px 125px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}h1,h2,h3,p{margin-top:0}h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,48px);font-weight:400;line-height:1.1;margin-bottom:14px}h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin-bottom:14px}h3{font-size:18px;margin-bottom:8px}.muted{color:var(--muted)}.lead{max-width:620px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:12px 0 28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}.stat,.card{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:22px}.stat b{font-family:Georgia,serif;font-size:32px;font-weight:400;display:block}.stat span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{overflow:hidden}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;background:#eaf0e7;color:#375743;border-radius:30px;padding:4px 10px;font-size:12px;margin:0 8px 12px 0}.date{font-size:13px;color:var(--muted)}.cover{width:calc(100% + 44px);max-height:300px;object-fit:cover;margin:-22px -22px 18px;display:block}.photos{display:flex;gap:8px;overflow:auto;margin:14px 0}.photos button{padding:0;border:0;flex:0 0 80px;height:80px;overflow:hidden}.photos img{width:100%;height:100%;object-fit:cover}.empty{text-align:center;border:1px dashed #aab9a8;border-radius:20px;padding:45px 22px;background:#edf0e7}.empty .house{font-size:44px;display:block;margin-bottom:12px}.empty p{max-width:440px;margin:0 auto 22px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8f5;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(16px)}nav button{border:0;background:transparent;flex:1;max-width:180px;font-size:13px;padding:8px 3px}nav button span{display:block;font-size:21px}nav button[aria-current=page]{background:#e5eddf}.filter{display:flex;gap:12px;margin-bottom:22px}.filter>*{flex:1;min-width:0}
input,select,textarea{width:100%;border:1px solid #bfc8bb;border-radius:10px;background:#fff;padding:12px;color:#233e32;font-size:16px}textarea{min-height:140px;resize:vertical}label{display:block;font-size:14px;font-weight:650;margin-bottom:18px}label input,label textarea,label select{margin-top:6px}input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--green)}.checkrow{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.checkrow label{margin:0;flex:1;display:flex;gap:12px;align-items:center;font-weight:500}.checkrow label span{overflow-wrap:anywhere}.checkrow.done label span{text-decoration:line-through;color:var(--muted)}progress{width:100%;accent-color:var(--green);height:12px;margin:10px 0 22px}dialog{border:1px solid var(--line);border-radius:22px;padding:28px;max-width:600px;width:calc(100% - 28px);max-height:90dvh;overflow:auto;background:#fffdf8;color:#233e32}dialog::backdrop{background:#10291fc0}dialog .row{margin-bottom:20px}.help{font-size:13px;color:var(--muted);margin:12px 0 20px}.notice{background:#eee9d8;border-radius:12px;padding:14px;font-size:14px;margin:18px 0}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#203e31;color:white;border-radius:12px;padding:14px 20px;max-width:90vw;width:max-content;z-index:20}#toast:empty{display:none}.fullphoto{max-width:100%;max-height:70dvh;display:block;margin:auto}.settings{max-width:680px}.settings .card{margin-bottom:20px}
@media(max-width:600px){header{padding:18px 20px}header strong{font-size:22px}main{padding:26px 18px 120px}.grid{grid-template-columns:1fr}.stat{padding:14px}.stat b{font-size:28px}.stat span{font-size:11px}.filter{flex-direction:column}.hero .primary{width:100%}.card{padding:18px}.cover{width:calc(100% + 36px);margin:-18px -18px 16px}dialog{padding:20px}}
</style></head>
<body>
<header><div><strong>⌂ Hausmomente</strong><small>Unser Weg nach Hause.</small></div><span id="status">Wird geladen</span></header>
<main id="app"><p>Dein Bautagebuch wird geöffnet …</p></main>
<nav aria-label="Hauptnavigation"><button data-tab="diary"><span aria-hidden="true">▤</span>Tagebuch</button><button data-tab="phases"><span aria-hidden="true">⌂</span>Bauphasen</button><button data-tab="tasks"><span aria-hidden="true">✓</span>Aufgaben</button><button data-tab="settings"><span aria-hidden="true">⚙</span>Projekt</button></nav>
<dialog id="editor"><form id="entryform"><div class="row"><h2 id="editor-title">Neuer Hausmoment</h2><button type="button" data-close="editor" aria-label="Schließen">✕</button></div>
<label>Titel<input name="title" maxlength="150" required placeholder="Heute ist etwas Großes passiert …"></label>
<div class="row"><label>Datum<input name="date" type="date" required></label><label>Gewerk<select name="trade"></select></label></div>
<label>Deine Notizen<textarea name="note" maxlength="20000" placeholder="Was ist passiert? Was möchtest du festhalten?"></textarea></label>
<label>Fotos hinzufügen<input id="photos-input" type="file" accept="image/*" multiple></label><p class="help">Bis zu 8 Fotos. Wir speichern verkleinerte Kopien; die Originale bleiben unverändert. Fotos bitte zusätzlich in deiner Fotobibliothek behalten.</p><div id="photo-preview" class="photos"></div>
<button class="primary" type="submit">Hausmoment speichern</button><p id="form-error" role="alert"></p></form></dialog>
<dialog id="viewer"><div class="row"><h2>Dein Hausmoment</h2><button data-close="viewer" aria-label="Foto schließen">✕</button></div><img class="fullphoto" alt="Foto aus deinem Bautagebuch"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), trades=['Allgemein','Planung','Erdarbeiten','Rohbau','Dach','Fenster & Türen','Haustechnik','Innenausbau','Außenanlagen'];
const phaseNames=['Planung & Genehmigung','Erdarbeiten & Fundament','Rohbau','Dach & Fenster','Haustechnik','Innenausbau','Außenanlagen','Einzug'];
const initial=()=>({schema:1,revision:0,project:{name:'Unser Zuhause',location:''},entries:[],tasks:[],phases:phaseNames.map(name=>({name,done:false}))});
let db,state,tab='diary',search='',filter='',editId=null,draftPhotos=[],busy=false,ready=false,toastTimer;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dateText=s=>new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00'));
function notify(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6500)}
function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===v}
function validate(x){
 const str=(v,n)=>typeof v==='string'&&v.length<=n;
 const fail=()=>{throw Error('Diese Datei ist keine gültige Hausmomente-Web-Sicherung (Version 1).')};
 if(!x||x.schema!==1||!x.project||!str(x.project.name,100)||!x.project.name.trim()||!str(x.project.location,200)||!Array.isArray(x.entries)||x.entries.length>10000||!Array.isArray(x.tasks)||x.tasks.length>10000||!Array.isArray(x.phases)||x.phases.length!==8)fail();
 const seen=new Set();
 for(const e of x.entries){if(!e||!str(e.id,100)||!e.id||seen.has(e.id)||!str(e.title,150)||!e.title.trim()||!validDate(e.date)||!trades.includes(e.trade)||!str(e.note,20000)||!Array.isArray(e.photos)||e.photos.length>8)fail();seen.add(e.id);for(const p of e.photos)if(!str(p,4000000)||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(p))fail()}
 seen.clear();for(const t of x.tasks){if(!t||!str(t.id,100)||!t.id||seen.has(t.id)||!str(t.title,300)||!t.title.trim()||typeof t.done!=='boolean')fail();seen.add(t.id)}
 for(let i=0;i<8;i++)if(!x.phases[i]||x.phases[i].name!==phaseNames[i]||typeof x.phases[i].done!=='boolean')fail();
 return {schema:1,revision:Number.isSafeInteger(x.revision)&&x.revision>=0?x.revision:0,project:{name:x.project.name,location:x.project.location},entries:x.entries.map(e=>({id:e.id,title:e.title,date:e.date,trade:e.trade,note:e.note,photos:e.photos.slice()})),tasks:x.tasks.map(t=>({id:t.id,title:t.title,done:t.done})),phases:x.phases.map(p=>({name:p.name,done:p.done}))};
}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('hausmomente-web',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Bitte andere Hausmomente-Fenster schließen und erneut öffnen.'));r.onsuccess=()=>resolve(r.result)})}
function read(){return new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get('project');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function save(next){
 next=validate(next);const expected=state.revision;next.revision=expected+1;
 await new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite'),store=tx.objectStore('data');let conflict=false;const r=store.get('project');r.onsuccess=()=>{if((r.result?.revision||0)!==expected){conflict=true;tx.abort()}else store.put(next,'project')};tx.oncomplete=resolve;tx.onabort=()=>reject(Error(conflict?'Die Daten wurden in einem anderen Fenster geändert. Bitte die App neu öffnen; deine Änderung wurde nicht gespeichert.':'Speichern fehlgeschlagen. Möglicherweise ist der Gerätespeicher voll. Deine bisherigen Daten bleiben erhalten.'));tx.onerror=()=>{}});
 state=next;
}
async function change(fn){const next=structuredClone(state);fn(next);await save(next);render()}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
 const done=state.phases.filter(p=>p.done).length;
 let html='';
 if(tab==='diary'){
 const entries=state.entries.filter(e=>(!filter||e.trade===filter)&&(!search||(e.title+' '+e.note).toLocaleLowerCase('de').includes(search.toLocaleLowerCase('de')))).sort((a,b)=>b.date.localeCompare(a.date));
 html='<section class="hero"><div class="eyebrow">Dein Bautagebuch</div><div class="row"><div><h1>'+esc(state.project.name)+'</h1><p class="lead">'+(state.project.location?esc(state.project.location)+' · ':'')+'Aus einem Plan wird ein Zuhause. Halte euren Weg fest.</p></div><button class="primary" data-action="new">+ Neuer Hausmoment</button></div></section><div class="stats"><div class="stat"><b>'+state.entries.length+'</b><span>Hausmomente</span></div><div class="stat"><b>'+state.entries.reduce((n,e)=>n+e.photos.length,0)+'</b><span>Erinnerungsfotos</span></div><div class="stat"><b>'+done+' / 8</b><span>Bauphasen geschafft</span></div></div><div class="filter"><input id="search" aria-label="Tagebuch durchsuchen" placeholder="Hausmomente durchsuchen …" value="'+esc(search)+'"><select id="filter" aria-label="Nach Gewerk filtern"><option value="">Alle Gewerke</option>'+trades.map(t=>'<option '+(filter===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>';
 html+=entries.length?'<div class="grid">'+entries.map(e=>'<article class="card">'+(e.photos[0]?'<img class="cover" loading="lazy" src="'+e.photos[0]+'" alt="Foto zu '+esc(e.title)+'">':'')+'<span class="tag">'+esc(e.trade)+'</span><span class="date">'+dateText(e.date)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.note)+'</p><div class="photos">'+e.photos.map((p,i)=>'<button data-action="photo" data-id="'+esc(e.id)+'" data-index="'+i+'" aria-label="Foto '+(i+1)+' vergrößern"><img loading="lazy" src="'+p+'" alt=""></button>').join('')+'</div><div class="actions"><button data-action="edit" data-id="'+esc(e.id)+'">Bearbeiten</button><button class="danger" data-action="delete-entry" data-id="'+esc(e.id)+'">Löschen</button></div></article>').join('')+'</div>':'<div class="empty"><span class="house" aria-hidden="true">⌂</span><h2>'+(state.entries.length?'Keine passenden Hausmomente':'Hier beginnt eure Geschichte')+'</h2><p>'+(state.entries.length?'Versuche einen anderen Suchbegriff oder ein anderes Gewerk.':'Der erste Spatenstich, die fertigen Wände, ein besonderer Baustellenmoment. Bewahre auf, was euch wichtig ist.')+'</p><button class="primary" data-action="new">Ersten oder neuen Eintrag anlegen</button></div>';
 }else if(tab==='phases'){html='<div class="hero"><div class="eyebrow">Schritt für Schritt</div><h1>Euer Zuhause wächst.</h1><p class="lead">Hake eine Phase ab, sobald sie abgeschlossen ist.</p></div><div class="card"><div class="row"><h2>Baufortschritt</h2><b>'+done+' von 8 Phasen</b></div><progress max="8" value="'+done+'" aria-label="Abgeschlossene Bauphasen"></progress>'+state.phases.map((p,i)=>'<div class="checkrow '+(p.done?'done':'')+'"><label><input type="checkbox" data-phase="'+i+'" '+(p.done?'checked':'')+'><span>'+esc(p.name)+'</span></label></div>').join('')+'<p class="help">Der Fortschritt zählt abgeschlossene Phasen; er ist keine Berechnung des tatsächlichen Bauvolumens.</p></div>';
 }else if(tab==='tasks'){html='<div class="hero"><div class="eyebrow">Gut organisiert</div><h1>Das steht als Nächstes an.</h1><p class="lead">'+state.tasks.filter(t=>!t.done).length+' offene Aufgaben für euer Zuhause.</p></div><form id="taskform" class="filter"><input name="title" maxlength="300" required aria-label="Neue Aufgabe" placeholder="Zum Beispiel: Fliesen für das Bad auswählen"><button class="primary">+ Aufgabe hinzufügen</button></form><div class="card">'+(state.tasks.length?state.tasks.map(t=>'<div class="checkrow '+(t.done?'done':'')+'"><label><input type="checkbox" data-task="'+esc(t.id)+'" '+(t.done?'checked':'')+'><span>'+esc(t.title)+'</span></label><button class="danger" data-action="delete-task" data-id="'+esc(t.id)+'" aria-label="Aufgabe löschen">✕</button></div>').join(''):'<h2>Platz für eure nächsten Schritte.</h2><p class="muted">Trage oben die erste Aufgabe ein.</p>')+'</div>';
 }else{html='<div class="hero"><div class="eyebrow">Ganz euer Projekt</div><h1>Ein Zuhause mit Namen.</h1></div><div class="settings"><form id="projectform" class="card"><label>Projektname<input name="name" maxlength="100" required value="'+esc(state.project.name)+'"></label><label>Ort <span class="muted">(optional)</span><input name="location" maxlength="200" value="'+esc(state.project.location)+'"></label><button class="primary">Projekt speichern</button></form><section class="card"><h2>Erinnerungen sichern</h2><p>Einträge und Fotos liegen nur in diesem Browser bzw. dieser installierten Web-App. Es gibt keine Cloud-Synchronisierung. Ein Gerätewechsel, gelöschte Website-Daten oder Speicherbereinigung können sie entfernen.</p><div class="notice">Exportiere regelmäßig eine Sicherung in die Dateien-App oder auf deinen Computer. Sie enthält auch deine verkleinerten Fotos.</div><button class="primary" data-action="export">Sicherung herunterladen</button><hr><label>Sicherung wiederherstellen<input id="import" type="file" accept=".json,application/json"></label><p class="help">Nur Hausmomente-Web-Sicherungen Version 1. Der Import ersetzt nach Rückfrage den gesamten aktuellen Stand. Sicherungen der nativen iPhone-App werden hier noch nicht unterstützt.</p></section><section class="card"><h2>Auf dem Handy installieren</h2><p><b>iPhone:</b> Diese Seite in Safari öffnen → Teilen → Zum Home-Bildschirm → Als Web-App öffnen → Hinzufügen.</p><p><b>Android:</b> Im Browser-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ auswählen.</p><p class="help" id="offline-help">Offline-Vorbereitung wird geprüft …</p><p class="help">Verwende danach immer dasselbe App-Symbol. Browser und Home-Bildschirm-App können getrennte Datenspeicher haben. Übertrage vorhandene Daten bei Bedarf per Export und Import.</p></section><p class="help">Hausmomente Web · Version 1.0 · Keine Anmeldung, keine Analyse-Dienste. GitHub stellt die App-Dateien bereit; dein Tagebuch wird von dieser App nicht hochgeladen.</p></div>'}
 $('#app').innerHTML=html;offlineStatus();
}
function offlineStatus(){const s=$('#offline-help');if(s)s.textContent=navigator.serviceWorker?.controller?'Offline-Version bereit. Nach erfolgreichem Laden kannst du diese App auch ohne Internet öffnen.':'Offline-Modus ist noch nicht bestätigt. Beim ersten Besuch online bleiben und die App danach erneut öffnen.';$('#status').textContent=navigator.onLine?'Auf deinem Gerät':'Offline'}
function photoPreview(){$('#photo-preview').innerHTML=draftPhotos.map((p,i)=>'<button type="button" data-remove-photo="'+i+'" aria-label="Foto '+(i+1)+' entfernen"><img src="'+p+'" alt="Foto entfernen"></button>').join('')}
function editor(entry){editId=entry?.id||null;draftPhotos=entry?.photos.slice()||[];const f=$('#entryform');f.reset();f.elements.title.value=entry?.title||'';f.elements.date.value=entry?.date||today();f.elements.trade.innerHTML=trades.map(t=>'<option>'+esc(t)+'</option>').join('');f.elements.trade.value=entry?.trade||'Allgemein';f.elements.note.value=entry?.note||'';$('#editor-title').textContent=entry?'Hausmoment bearbeiten':'Neuer Hausmoment';$('#form-error').textContent='';photoPreview();$('#editor').showModal()}
function compress(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const result=c.toDataURL('image/jpeg',.8);if(result.length>4000000)throw Error('Dieses Bild ist zu groß. Bitte wähle eine kleinere Kopie.');resolve(result)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Foto konnte nicht gelesen werden. Bitte als JPEG oder PNG auswählen.'))};img.src=url})}
async function guarded(fn){if(busy||!ready)return;busy=true;document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=true);try{await fn()}catch(e){notify(e.message||'Die Aktion ist fehlgeschlagen.');if($('#editor').open)$('#form-error').textContent=e.message}finally{busy=false;document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=false)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy||!ready)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
 if(b.dataset.close){$('#'+b.dataset.close).close();return}
 if(b.dataset.removePhoto!==undefined){draftPhotos.splice(Number(b.dataset.removePhoto),1);photoPreview();return}
 const a=b.dataset.action,entry=state.entries.find(x=>x.id===b.dataset.id);
 if(a==='new')editor();if(a==='edit'&&entry)editor(entry);
 if(a==='photo'&&entry){$('#viewer img').src=entry.photos[Number(b.dataset.index)];$('#viewer').showModal()}
 if(a==='delete-entry'&&entry&&confirm('Diesen Hausmoment mit allen zugehörigen Fotos löschen?'))guarded(()=>change(s=>s.entries=s.entries.filter(x=>x.id!==entry.id)));
 if(a==='delete-task'&&confirm('Diese Aufgabe löschen?'))guarded(()=>change(s=>s.tasks=s.tasks.filter(t=>t.id!==b.dataset.id)));
 if(a==='export'){const blob=new Blob([JSON.stringify(state)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Hausmomente-'+today()+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('Export geöffnet. Bitte die JSON-Datei sicher in „Dateien“ speichern.')}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='filter'){filter=t.value;render()}
 if(t.dataset.phase!==undefined){const n=Number(t.dataset.phase),checked=t.checked;guarded(async()=>{try{await change(s=>s.phases[n].done=checked)}catch(e){render();throw e}})}
 if(t.dataset.task){const key=t.dataset.task,checked=t.checked;guarded(async()=>{try{await change(s=>s.tasks.find(x=>x.id===key).done=checked)}catch(e){render();throw e}})}
 if(t.id==='photos-input'){const files=Array.from(t.files);guarded(async()=>{if(files.length+draftPhotos.length>8)throw Error('Bitte insgesamt höchstens 8 Fotos auswählen.');const additions=[];for(const f of files){if(f.size>30000000)throw Error('Ein Foto ist größer als 30 MB. Bitte eine kleinere Kopie wählen.');additions.push(await compress(f))}draftPhotos.push(...additions);photoPreview()}).finally(()=>t.value='')}
 if(t.id==='import'){const file=t.files[0];if(!file)return;guarded(async()=>{if(file.size>100000000)throw Error('Diese Sicherung ist größer als 100 MB. Import abgebrochen.');let data;try{data=validate(JSON.parse(await file.text()))}catch(e){throw Error('Import abgebrochen: '+e.message)}if(!confirm('Alle aktuellen Daten durch '+data.entries.length+' Einträge und '+data.tasks.length+' Aufgaben aus dieser Sicherung ersetzen? Exportiere deinen aktuellen Stand zuerst, falls du ihn behalten möchtest.'))return;await save(data);render();notify('Sicherung wiederhergestellt.')}).finally(()=>t.value='')}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.checkValidity())return;const values=Object.fromEntries(new FormData(f));
 if(f.id==='entryform'){guarded(async()=>{if(!values.title.trim())throw Error('Bitte einen Titel eingeben.');const entry={id:editId||id(),title:values.title.trim(),date:values.date,trade:values.trade,note:values.note,photos:draftPhotos.slice()};await change(s=>{const n=s.entries.findIndex(x=>x.id===entry.id);if(n<0)s.entries.push(entry);else s.entries[n]=entry});$('#editor').close();notify('Dein Hausmoment ist gespeichert.')})}
 if(f.id==='taskform')guarded(async()=>{if(!values.title.trim())throw Error('Bitte eine Aufgabe eingeben.');await change(s=>s.tasks.push({id:id(),title:values.title.trim(),done:false}))});
 if(f.id==='projectform')guarded(async()=>{if(!values.name.trim())throw Error('Bitte einen Projektnamen eingeben.');await change(s=>s.project={name:values.name.trim(),location:values.location.trim()});notify('Projekt gespeichert.')});
});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>{if(busy)e.preventDefault()}));
addEventListener('online',offlineStatus);addEventListener('offline',offlineStatus);
(async()=>{try{db=await openDB();const loaded=await read();state=loaded?validate(loaded):initial();ready=true;render();if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js');navigator.serviceWorker.addEventListener('controllerchange',offlineStatus);await navigator.serviceWorker.ready;offlineStatus()}catch(e){notify('Offline-Vorbereitung fehlgeschlagen. Bitte später online erneut öffnen.')}}}catch(e){$('#app').textContent='Das Tagebuch konnte nicht geöffnet werden. Es wurden keine Daten überschrieben. Bitte keinen privaten Browsermodus verwenden. Fehler: '+e.message;$('#status').textContent='Speicherproblem'}})();
</script></body></html>
